<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ▼ ここから下は、SNSにリンクを貼ったときのプレビューに使われます。
       公開先のURLを変えたら、下の2か所のURLも書き換えてください。 -->
  <title>つくったアプリ置き場</title>
  <meta name="description" content="個人で開発した Mac アプリをまとめています。どれも無料で、通信もしません。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="つくったアプリ置き場">
  <meta property="og:title" content="つくったアプリ置き場">
  <meta property="og:description" content="個人で開発した Mac アプリをまとめています。どれも無料で、通信もしません。">
  <meta property="og:url" content="https://kid1412525.github.io/">
  <meta property="og:image" content="https://kid1412525.github.io/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">
  <!-- ▲ ここまで -->

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script>
    // 描画前に配色を決めて、ちらつきを防ぐ
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#apps">アプリ一覧へ移動</a>

  <header class="site-header wrap">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true"></span>
      <span id="brand-name"></span>
    </a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="ライト／ダークを切り替える">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <main>
    <section class="hero wrap">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="lead" id="hero-bio"></p>
      <ul class="socials" id="socials"></ul>
    </section>

    <section class="apps wrap" id="apps">
      <h2>アプリ一覧</h2>
      <ul class="grid" id="grid"></ul>
      <noscript><p class="empty">アプリ一覧の表示には JavaScript が必要です。</p></noscript>
    </section>
  </main>

  <footer class="wrap">
    <div class="site-footer">
      <p id="copyright"></p>
      <a href="#top" id="back-to-top">上へ戻る ↑</a>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="apps.js"></script>
  <script src="script.js"></script>
</body>
</html>
